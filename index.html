
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Registro de Palete Perdido</title>
<style>
  :root {
    --squid-ink: #232f3e;
    --amazon-orange: #ff9900;
    --amazon-orange-hover: #ec7211;
    --bg: #f2f3f3;
    --card-bg: #ffffff;
    --text-primary: #16191f;
    --text-secondary: #545b64;
    --text-label: #687078;
    --border-color: #d5dbdb;
    --border-focus: #ff9900;
    --input-bg: #ffffff;
    --badge-bg: rgba(255,153,0,0.12);
    --shadow-md: 0 2px 8px rgba(0,0,0,0.08);
    --radius: 8px;
    --toggle-bg: #d5dbdb;
    --toggle-dot: #ffffff;
    --overlay-bg: rgba(0,0,0,0.4);
  }

  html.dark {
    --bg: #0d1117;
    --card-bg: #161b22;
    --text-primary: #e6edf3;
    --text-secondary: #8b949e;
    --text-label: #8b949e;
    --border-color: #30363d;
    --input-bg: #0d1117;
    --badge-bg: rgba(255,153,0,0.15);
    --shadow-md: 0 2px 8px rgba(0,0,0,0.3);
    --toggle-bg: #ff9900;
    --toggle-dot: #232f3e;
    --overlay-bg: rgba(0,0,0,0.6);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

  html { font-size: 16px; }

  body {
    font-family: "Amazon Ember", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: var(--bg);
    color: var(--text-primary);
    padding: 0;
    margin: 0;
    min-height: 100vh;
    min-height: 100dvh;
    transition: background 0.3s ease, color 0.3s ease;
    -webkit-text-size-adjust: 100%;
  }

  /* ── Navbar fixa no topo ── */
  .navbar {
    display: flex; align-items: center; justify-content: space-between;
    background: var(--squid-ink); padding: 12px 16px;
    position: sticky; top: 0; z-index: 50;
  }
  .navbar-title { color: #fff; font-size: 14px; font-weight: 700; display: flex; align-items: center; gap: 8px; }
  .navbar-title .logo { color: var(--amazon-orange); font-weight: 900; font-size: 16px; }

  .toggle-wrap { display: flex; align-items: center; gap: 6px; }
  .toggle-wrap span { color: #8b949e; font-size: 13px; }
  .toggle-track { position: relative; width: 38px; height: 20px; background: var(--toggle-bg); border-radius: 10px; cursor: pointer; transition: background 0.3s ease; }
  .toggle-track input { display: none; }
  .toggle-dot { position: absolute; top: 2px; left: 2px; width: 16px; height: 16px; background: var(--toggle-dot); border-radius: 50%; transition: transform 0.3s ease, background 0.3s ease; }
  .toggle-track input:checked ~ .toggle-dot { transform: translateX(18px); }

  /* ── Container principal ── */
  .page { padding: 16px 12px 32px; max-width: 560px; margin: 0 auto; }

  .card { background: var(--card-bg); border: 1px solid var(--border-color); border-radius: var(--radius); padding: 20px 16px; box-shadow: var(--shadow-md); transition: background 0.3s ease, border-color 0.3s ease; }
  .card-header { margin-bottom: 16px; }
  .card-header h1 { font-size: 18px; font-weight: 700; color: var(--text-primary); margin-bottom: 4px; }
  .card-header p { font-size: 13px; color: var(--text-secondary); line-height: 1.5; }
  .divider { height: 1px; background: var(--border-color); margin: 0 -16px 16px; transition: background 0.3s ease; }

  /* ── Campos ── */
  .field { margin-bottom: 14px; }
  .field > label { display: block; font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.6px; color: var(--text-label); margin-bottom: 5px; }
  .field input[type="text"], .field select, .field textarea {
    width: 100%; padding: 12px; border: 1.5px solid var(--border-color); border-radius: 6px;
    font-size: 16px; background: var(--input-bg); color: var(--text-primary); outline: none;
    transition: border-color 0.2s ease, box-shadow 0.2s ease, background 0.2s ease;
    appearance: none; -webkit-appearance: none;
  }
  .field select {
    background-image: url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23687078' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3e%3cpolyline points='6 9 12 15 18 9'/%3e%3c/svg%3e");
    background-repeat: no-repeat; background-position: right 12px center; background-size: 18px; padding-right: 38px;
  }
  .field textarea { min-height: 72px; resize: vertical; }
  .field input[type="text"]:focus, .field select:focus, .field textarea:focus { border-color: var(--border-focus); box-shadow: 0 0 0 3px rgba(255,153,0,0.25); }

  /* ── Turno ── */
  .turno-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .turno-grid input[type="radio"] { display: none; }
  .turno-btn {
    display: flex; align-items: center; justify-content: center; padding: 12px 8px; border-radius: 6px;
    font-size: 13px; font-weight: 600; cursor: pointer; letter-spacing: 0.2px;
    transition: border-color 0.2s ease, background 0.2s ease;
    border: 1.5px solid var(--border-color); background: transparent; color: var(--text-secondary);
    -webkit-user-select: none; user-select: none;
  }
  .turno-btn::before { content: ''; display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 7px; flex-shrink: 0; }
  .turno-btn.blue::before { background: #5b8def; }
  .turno-btn.red::before { background: #e06c6c; }
  .turno-grid input[type="radio"]:checked + .turno-btn { color: var(--text-primary); border-color: var(--text-label); background: rgba(0,0,0,0.03); }
  html.dark .turno-grid input[type="radio"]:checked + .turno-btn { background: rgba(255,255,255,0.04); }
  .turno-btn:active { transform: scale(0.97); }

  /* ── Botões ── */
  .btn-row { display: flex; gap: 10px; margin-top: 10px; }
  .btn-primary {
    flex: 1; padding: 14px; border: none; border-radius: 6px;
    background: var(--amazon-orange); color: var(--squid-ink); font-size: 16px; font-weight: 700;
    cursor: pointer; transition: background 0.2s ease, transform 0.1s ease;
    box-shadow: 0 1px 3px rgba(255,153,0,0.3);
    -webkit-user-select: none; user-select: none;
  }
  .btn-primary:hover { background: var(--amazon-orange-hover); }
  .btn-primary:active { transform: scale(0.97); }
  .btn-export {
    padding: 14px 16px; border: 1.5px solid var(--border-color); border-radius: 6px;
    background: transparent; color: var(--text-secondary); font-size: 15px; font-weight: 600;
    cursor: pointer; transition: border-color 0.2s ease, background 0.2s ease;
    -webkit-user-select: none; user-select: none;
  }
  .btn-export:hover { border-color: var(--text-label); background: rgba(0,0,0,0.02); }
  html.dark .btn-export:hover { background: rgba(255,255,255,0.03); }

  .footer { text-align: center; margin-top: 28px; font-size: 11px; color: var(--text-label); }

  /* ── Modal ── */
  .modal-overlay {
    display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0;
    background: var(--overlay-bg); z-index: 999;
    align-items: center; justify-content: center; padding: 16px;
  }
  .modal-overlay.active { display: flex; }
  .modal-box {
    background: var(--card-bg); border-radius: 16px; padding: 28px 24px 24px;
    max-width: 340px; width: 100%; text-align: center;
    box-shadow: 0 12px 40px rgba(0,0,0,0.2); border: 1px solid var(--border-color);
    animation: modalPop 0.4s cubic-bezier(0.34,1.56,0.64,1);
  }
  .modal-emoji {
    font-size: 52px; margin-bottom: 12px;
    animation: emojiBounce 0.6s 0.15s cubic-bezier(0.34,1.56,0.64,1) both;
  }
  .modal-title { font-size: 18px; font-weight: 700; color: var(--text-primary); margin-bottom: 6px; }
  .modal-msg { font-size: 13px; color: var(--text-secondary); line-height: 1.5; margin-bottom: 12px; }
  .modal-detail {
    background: var(--bg); border-radius: 8px; padding: 10px 14px; margin-bottom: 14px;
    text-align: left; font-size: 12px; color: var(--text-secondary); line-height: 1.7;
    border: 1px solid var(--border-color);
  }
  .modal-detail strong { color: var(--text-primary); }
  .modal-counter { font-size: 11px; color: var(--text-label); margin-bottom: 14px; display: flex; align-items: center; justify-content: center; gap: 5px; }
  .modal-counter .num {
    display: inline-flex; align-items: center; justify-content: center;
    background: var(--amazon-orange); color: var(--squid-ink);
    font-weight: 800; font-size: 12px; width: 24px; height: 24px; border-radius: 50%;
  }
  .modal-btn {
    width: 100%; padding: 14px; border: none; border-radius: 8px;
    background: var(--amazon-orange); color: var(--squid-ink);
    font-size: 16px; font-weight: 700; cursor: pointer;
    transition: background 0.2s ease, transform 0.1s ease;
  }
  .modal-btn:hover { background: var(--amazon-orange-hover); }
  .modal-btn:active { transform: scale(0.97); }

  .confetti-container { position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 1000; overflow: hidden; }
  .confetti { position: absolute; top: -10px; border-radius: 2px; animation: confettiFall 2.5s ease-in forwards; }

  /* ── Responsivo ── */
  @media (max-width: 380px) {
    .navbar-title { font-size: 12px; }
    .navbar-title .logo { font-size: 14px; }
    .card { padding: 16px 12px; }
    .card-header h1 { font-size: 16px; }
    .turno-btn { font-size: 12px; padding: 10px 6px; }
    .btn-primary { font-size: 15px; padding: 13px; }
    .btn-export { padding: 13px 12px; font-size: 14px; }
    .divider { margin: 0 -12px 14px; }
  }

  @media (min-width: 600px) {
    .page { padding: 24px 20px 40px; }
    .card { padding: 28px 24px; border-radius: 12px; }
    .card-header h1 { font-size: 22px; }
    .field input[type="text"], .field select, .field textarea { font-size: 14px; padding: 10px 12px; }
    .btn-primary { font-size: 15px; padding: 12px; }
    .turno-btn { font-size: 14px; }
    .divider { margin: 0 -24px 20px; }
  }

  @keyframes modalPop { from { opacity: 0; transform: scale(0.85) translateY(20px); } to { opacity: 1; transform: scale(1) translateY(0); } }
  @keyframes emojiBounce { from { transform: scale(0) rotate(-15deg); } to { transform: scale(1) rotate(0deg); } }
  @keyframes confettiFall { 0% { transform: translateY(0) rotate(0deg); opacity: 1; } 100% { transform: translateY(100vh) rotate(720deg); opacity: 0; } }
</style>
</head>
<body>

<!-- Navbar sticky -->
<nav class="navbar">
  <div class="navbar-title"><span class="logo">▸</span> Registro de Palete Perdido</div>
  <div class="toggle-wrap">
    <span>☀️</span>
    <label class="toggle-track"><input type="checkbox" id="darkToggle" onchange="toggleDark()"><div class="toggle-dot"></div></label>
    <span>🌙</span>
  </div>
</nav>

<!-- Conteúdo -->
<div class="page">
  <div class="card">
    <div class="card-header">
      <h1>📦 Novo Registro</h1>
      <p>Preencha toda vez que encontrar um palete sem identificação.</p>
    </div>
    <div class="divider"></div>
    <form id="f">
      <div class="field">
        <label for="local">Onde encontrou?</label>
        <select id="local" required><option value="">Selecione...</option><option>Inbound</option><option>Outbound</option><option>Pit</option><option>C-Ret</option></select>
      </div>
      <div class="field">
        <label for="conteudo">Tipo do palete</label>
        <select id="conteudo" required><option value="">Selecione...</option><option>BBR</option><option>CHAP</option><option>Destacáveis</option><option>Quebrado</option></select>
      </div>
      <div class="field">
        <label for="movido">Movido para / ação tomada</label>
        <select id="movido" required><option value="">Selecione...</option><option>Buffer</option><option>Insumos</option><option>Descarte</option></select>
      </div>
      <div class="field">
        <label>Turno</label>
        <div class="turno-grid">
          <input type="radio" name="turno" id="t-bd" value="Blue Day" required><label for="t-bd" class="turno-btn blue">Blue Day</label>
          <input type="radio" name="turno" id="t-bn" value="Blue Night"><label for="t-bn" class="turno-btn blue">Blue Night</label>
          <input type="radio" name="turno" id="t-rd" value="Red Day"><label for="t-rd" class="turno-btn red">Red Day</label>
          <input type="radio" name="turno" id="t-rn" value="Red Night"><label for="t-rn" class="turno-btn red">Red Night</label>
        </div>
      </div>
      <div class="field">
        <label for="quem">Encontrado por (nome/login)</label>
        <input type="text" id="quem" placeholder="Ex: login123" required>
      </div>
      <div class="field">
        <label for="obs">Observação (opcional)</label>
        <textarea id="obs" placeholder="Algum detalhe que ajude..."></textarea>
      </div>
      <div class="btn-row">
        <button type="submit" class="btn-primary">Salvar Registro</button>
        <button type="button" class="btn-export" onclick="exportCSV()">🔥 CSV</button>
      </div>
    </form>
  </div>
  <div class="footer">XCV9 · Registro de Paletes · 2026</div>
</div>

<!-- Modal -->
<div class="modal-overlay" id="modal">
  <div class="modal-box">
    <div class="modal-emoji" id="modal-emoji">🎉</div>
    <div class="modal-title" id="modal-title">Valeu demais!</div>
    <div class="modal-msg" id="modal-msg">Obrigado por manter o site organizado.<br>Cada registro faz diferença!</div>
    <div class="modal-detail" id="modal-detail"></div>
    <div class="modal-counter">Você já registrou <span class="num" id="modal-count">0</span> paletes</div>
    <button class="modal-btn" onclick="closeModal()">Continuar</button>
  </div>
</div>

<div class="confetti-container" id="confetti"></div>

<script>
  var KEY = 'palete_perdido_simples';
  var dados = JSON.parse(localStorage.getItem(KEY) || '[]');

  var thankYouMessages = [
    { emoji: '🎉', title: 'Valeu demais!', msg: 'Obrigado por manter o site organizado.<br>Cada registro faz diferença!' },
    { emoji: '🙌', title: 'Mandou bem!', msg: 'Registro feito com sucesso.<br>O time agradece sua atenção!' },
    { emoji: '⭐', title: 'Show de bola!', msg: 'Mais um palete rastreado.<br>Você está ajudando muito o site!' },
    { emoji: '🏆', title: 'Excelente trabalho!', msg: 'Registro salvo certinho.<br>Continue assim, faz toda a diferença!' },
    { emoji: '💪', title: 'Boa, parceiro!', msg: 'Palete registrado com sucesso.<br>O site fica melhor com sua ajuda!' },
    { emoji: '🔥', title: 'Registro salvo!', msg: 'Obrigado pela colaboração.<br>Juntos mantemos tudo no lugar!' },
    { emoji: '👏', title: 'Muito obrigado!', msg: 'Mais um registro no sistema.<br>Sua dedicação é nota 10!' }
  ];

  function toggleDark() {
    document.documentElement.classList.toggle('dark', document.getElementById('darkToggle').checked);
    localStorage.setItem('dark_mode', document.getElementById('darkToggle').checked ? '1' : '0');
  }
  if (localStorage.getItem('dark_mode') === '1') {
    document.documentElement.classList.add('dark');
    document.getElementById('darkToggle').checked = true;
  }

  function launchConfetti() {
    var container = document.getElementById('confetti');
    container.innerHTML = '';
    var colors = ['#ff9900','#ec7211','#232f3e','#5b8def','#e06c6c','#10b981','#f59e0b'];
    for (var i = 0; i < 45; i++) {
      var c = document.createElement('div');
      c.className = 'confetti';
      c.style.left = Math.random() * 100 + '%';
      c.style.background = colors[Math.floor(Math.random() * colors.length)];
      c.style.animationDelay = (Math.random() * 0.8) + 's';
      c.style.animationDuration = (1.8 + Math.random() * 1.2) + 's';
      var size = 5 + Math.random() * 7;
      c.style.width = size + 'px';
      c.style.height = size + 'px';
      c.style.borderRadius = Math.random() > 0.5 ? '50%' : '2px';
      container.appendChild(c);
    }
    setTimeout(function() { container.innerHTML = ''; }, 3500);
  }

  function showModal(reg) {
    var msg = thankYouMessages[Math.floor(Math.random() * thankYouMessages.length)];
    document.getElementById('modal-emoji').textContent = msg.emoji;
    document.getElementById('modal-title').textContent = msg.title;
    document.getElementById('modal-msg').innerHTML = msg.msg;
    document.getElementById('modal-detail').innerHTML =
      '<strong>' + reg.local + '</strong> → ' + reg.conteudo + '<br>' +
      'Ação: <strong>' + reg.movido + '</strong><br>' +
      'Por: <strong>' + reg.quem + '</strong> · ' + reg.turno;
    document.getElementById('modal-count').textContent = dados.length;
    document.getElementById('modal').classList.add('active');
    launchConfetti();
  }

  function closeModal() {
    document.getElementById('modal').classList.remove('active');
  }

  document.getElementById('f').addEventListener('submit', function(e) {
    e.preventDefault();
    var turnoEl = document.querySelector('input[name="turno"]:checked');
    if (!turnoEl) return;
    var reg = {
      data: new Date().toLocaleString('pt-BR'),
      local: document.getElementById('local').value,
      conteudo: document.getElementById('conteudo').value,
      movido: document.getElementById('movido').value,
      turno: turnoEl.value,
      quem: document.getElementById('quem').value,
      obs: document.getElementById('obs').value
    };
    dados.unshift(reg);
    localStorage.setItem(KEY, JSON.stringify(dados));
    e.target.reset();
    showModal(reg);
  });

  function exportCSV() {
    if (!dados.length) { alert('Nenhum registro para exportar.'); return; }
    var linhas = ['Data;Onde encontrou;Tipo;Movido para/acao;Turno;Encontrado por;Observacao'];
    dados.forEach(function(r) {
      linhas.push([r.data, r.local, r.conteudo, r.movido, r.turno, r.quem, r.obs].map(function(x) { return '"' + (x || '').replace(/"/g, '""') + '"'; }).join(';'));
    });
    var blob = new Blob(['\ufeff' + linhas.join('\n')], { type: 'text/csv;charset=utf-8;' });
    var a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'paletes_perdidos.csv';
    a.click();
  }
</script>
</body>
</html>
